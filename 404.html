<style>
:root {
  /* layout: the site's reading room, one centred viewer panel */
  --bg: #070b12; --panel: #0d141f; --line: #22324a; --text: #e8eef6; --muted: #98a7bc; --accent: #66b2ff;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible Next", "Segoe UI", system-ui, sans-serif;
  --mono: "Atkinson Hyperlegible Mono", Consolas, ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text); font: 400 1.0625rem/1.6 var(--body); }
main { width: min(560px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: clamp(24px, 6vw, 44px); display: grid; gap: 18px; }
.hud { font: 400 .78rem/1.4 var(--mono); color: var(--muted); }
h1 { margin: 0; font: 800 clamp(2rem, 7vw, 2.8rem)/1.05 var(--display); letter-spacing: -.02em; }
p { margin: 0; color: var(--muted); }
.track { position: relative; height: 16px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 2px; background: var(--line); }
.track span { position: absolute; left: 0; right: 0; top: 4px; height: 8px; background: radial-gradient(circle, rgba(152, 167, 188, .5) 0 1.1px, transparent 1.5px) 0 0 / calc(100% / 40) 100% repeat-x; }
a.btn { justify-self: start; display: inline-flex; gap: 10px; align-items: center; background: var(--accent); color: #04101f; font-weight: 700; text-decoration: none; border-radius: 12px; padding: 13px 20px; }
a.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
</style>
